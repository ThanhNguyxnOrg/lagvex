# GolangCI-Lint v2 configuration for Lagvex.
# Keep the standard linter set and add project-specific checks explicitly.
version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - errcheck
    - misspell
    - unconvert
  settings:
    govet:
      disable:
        - shadow
    errcheck:
      check-type-assertions: false
      check-blank: false

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
