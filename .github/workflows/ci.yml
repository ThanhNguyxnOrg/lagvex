name: 🧪 CI & Quality Checks ⚙️

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-go.yml@12e418143b9054ac675e73cc1e16edfeefe81527
    with:
      job_name: Verify (Lagvex Go)
      go_version: stable
      lint_install_command: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      lint_command: golangci-lint run --timeout=5m
      test_command: go test -v -race ./...
      vet_command: go vet ./...
      build_command: go build ./...

  matrix-compile:
    name: 🔨 Cross-Compile Check
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            target: bin/lagvex-client.exe
          - os: linux
            arch: amd64
            target: bin/lagvex-client-linux-amd64
          - os: darwin
            arch: arm64
            target: bin/lagvex-client-darwin-arm64
          - os: darwin
            arch: amd64
            target: bin/lagvex-client-darwin-amd64
          - os: linux
            arch: amd64
            target: bin/lagvex-relay
            cmd: ./cmd/lagvex-relay
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: 🛠️ Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          CMD_PATH=${{ matrix.cmd || './cmd/lagvex-client' }}
          go build -ldflags="-s -w" -o ${{ matrix.target }} "$CMD_PATH"
