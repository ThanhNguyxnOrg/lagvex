name: 🧪 CI & Quality Checks ⚙️

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 🔍 Run Go Vet
        run: go vet ./...

      - name: ⚡ Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout=3m

      - name: 🧪 Run Unit Tests
        run: go test -v -race ./...

  matrix-compile:
    name: 🔨 Cross-Compile Check
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            target: bin/lagvex-client.exe
          - os: linux
            arch: amd64
            target: bin/lagvex-client-linux-amd64
          - os: darwin
            arch: arm64
            target: bin/lagvex-client-darwin-arm64
          - os: linux
            arch: amd64
            target: bin/lagvex-relay
            cmd: ./cmd/lagvex-relay
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 🛠️ Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          CMD_PATH=${{ matrix.cmd || './cmd/lagvex-client' }}
          go build -ldflags="-s -w" -o ${{ matrix.target }} $CMD_PATH
