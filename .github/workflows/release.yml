name: 🚀 Build & Publish Release 📦

on:
  create:
  # Reconcile a tagged release whose tag exists but whose draft was never created.
  # This path is intentionally limited to edits of this workflow on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild after a failed release (no tag is created).
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  detect:
    name: 🔎 Detect Release Intent
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Resolve centrally created release tag
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOULD_RELEASE="false"
          VERSION=""
          TAG=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            # A release tag can be created without going through the central
            # commit-intent controller. Pick the newest reachable semver tag
            # that has a changelog section but no Release record yet.
            RELEASES="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            while IFS= read -r CANDIDATE; do
              [[ "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || continue
              CANDIDATE_VERSION="${CANDIDATE#v}"
              git merge-base --is-ancestor "${CANDIDATE}^{commit}" HEAD || continue
              grep -Eq "^## \\[${CANDIDATE_VERSION}\\]([[:space:]]|$)" CHANGELOG.md || continue
              if jq -e --arg tag "$CANDIDATE" '[.[] | select(.tag_name == $tag)] | length > 0' <<< "$RELEASES" >/dev/null; then
                continue
              fi
              TAG="$CANDIDATE"
              break
            done < <(git tag --list 'v[0-9]*' --sort=-version:refname)
          fi

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?)$ ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              git merge-base --is-ancestor "${TAG}^{commit}" HEAD || {
                echo "::error::The selected release tag is not reachable from main: $TAG"
                exit 1
              }
            else
              CHECKED_OUT_TAG="$(git describe --tags --exact-match HEAD)"
              if [[ "$CHECKED_OUT_TAG" != "$TAG" ]]; then
                echo "::error::The selected ref is not the exact requested tag: $TAG"
                exit 1
              fi
            fi
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          elif [[ -n "$TAG" ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Central release event: tag=$TAG should_release=$SHOULD_RELEASE"

  build-and-release:
    name: 📦 Build Multi-Platform & Publish
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: 🔨 Compile Release Binaries
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir -p dist

          # 1. Windows amd64 Client (Compiled as GUI subsystem to prevent terminal popup on double-click)
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui -X main.version=${VERSION}" -o dist/lagvex-client.exe ./cmd/lagvex-client
          
          # 2. Linux amd64 Client & Relay
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-client-linux-amd64 ./cmd/lagvex-client
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-relay ./cmd/lagvex-relay

          # 3. macOS arm64 (Apple Silicon) Client
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-client-darwin-arm64 ./cmd/lagvex-client

          # 4. macOS amd64 (Intel) Client
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-client-darwin-amd64 ./cmd/lagvex-client

      - name: 📦 Package Archives
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          mkdir -p release-artifacts

          # 🪟 Windows Client ZIP
          mkdir -p pack-win
          cp dist/lagvex-client.exe pack-win/
          if [ -f "bin/amd64/wintun.dll" ]; then
            cp bin/amd64/wintun.dll pack-win/
          fi
          cp -r configs pack-win/
          cp README.md LICENSE pack-win/
          cd pack-win && zip -r ../release-artifacts/lagvex-${TAG}-windows-amd64.zip . && cd ..

          # 🐧 Linux Client TAR.GZ
          mkdir -p pack-linux
          cp dist/lagvex-client-linux-amd64 pack-linux/lagvex-client
          chmod +x pack-linux/lagvex-client
          cp scripts/start-linux.sh pack-linux/start.sh
          chmod +x pack-linux/start.sh
          cp scripts/lagvex.desktop pack-linux/
          cp -r configs pack-linux/
          cp README.md LICENSE pack-linux/
          tar -czvf release-artifacts/lagvex-${TAG}-linux-amd64.tar.gz -C pack-linux .

          # 🍎 macOS Client TAR.GZ (Apple Silicon)
          mkdir -p pack-darwin-arm64
          sh scripts/create-macos-app.sh dist/lagvex-client-darwin-arm64 pack-darwin-arm64 "${TAG#v}"
          cp dist/lagvex-client-darwin-arm64 pack-darwin-arm64/lagvex-client
          chmod +x pack-darwin-arm64/lagvex-client
          cp -r configs pack-darwin-arm64/
          cp README.md LICENSE pack-darwin-arm64/
          tar -czvf release-artifacts/lagvex-${TAG}-darwin-arm64.tar.gz -C pack-darwin-arm64 .

          # 🍎 macOS Client TAR.GZ (Intel)
          mkdir -p pack-darwin-amd64
          sh scripts/create-macos-app.sh dist/lagvex-client-darwin-amd64 pack-darwin-amd64 "${TAG#v}"
          cp dist/lagvex-client-darwin-amd64 pack-darwin-amd64/lagvex-client
          chmod +x pack-darwin-amd64/lagvex-client
          cp -r configs pack-darwin-amd64/
          cp README.md LICENSE pack-darwin-amd64/
          tar -czvf release-artifacts/lagvex-${TAG}-darwin-amd64.tar.gz -C pack-darwin-amd64 .

          # ☁️ Linux Relay Server TAR.GZ
          mkdir -p pack-relay
          cp dist/lagvex-relay pack-relay/
          cp scripts/install-relay.sh pack-relay/
          cp docker-compose.yml Dockerfile pack-relay/
          cp README.md LICENSE pack-relay/
          tar -czvf release-artifacts/lagvex-relay-${TAG}-linux-amd64.tar.gz -C pack-relay .

          # 🔐 Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum * > checksums.txt
          cd ..

      - name: Upload packaged assets for the shared publisher
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-lagvex
          path: release-artifacts/*
          if-no-files-found: error

  prepare-release-draft:
    name: 📝 Ensure release draft exists
    needs: [detect, build-and-release]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout tagged release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🧾 Create or recover the tagged draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}"
          TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
          RELEASES="$(gh api "${API}/releases?per_page=100")"

          MATCH="$(jq -c --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | sort_by(.created_at) | last // empty' <<< "$RELEASES")"
          if [[ -n "$MATCH" && "$MATCH" != "null" ]]; then
            IS_DRAFT="$(jq -r '.draft' <<< "$MATCH")"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Release $TAG is already published; refusing to mutate it."
              exit 1
            fi
            echo "Reusing existing draft $TAG (release id $(jq -r '.id' <<< "$MATCH"))."
            exit 0
          fi

          # Recover an older untagged draft only when both its target SHA and
          # release name identify this exact version. Never attach an unrelated draft.
          ORPHAN_ID="$(jq -r --arg tag "$TAG" --arg sha "$TAG_SHA" '
            [.[] | select(
              .draft == true
              and (.tag_name | startswith("untagged-"))
              and .target_commitish == $sha
              and ((.name // "") | endswith($tag))
            )] | sort_by(.created_at) | last | .id // empty
          ' <<< "$RELEASES")"
          if [[ -n "$ORPHAN_ID" ]]; then
            RELEASE="$(gh api --method PATCH "${API}/releases/${ORPHAN_ID}" \
              -f tag_name="$TAG" -f target_commitish="$TAG_SHA" -F draft=true)"
            jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == true' <<< "$RELEASE" >/dev/null
            echo "Recovered orphan draft $ORPHAN_ID for $TAG."
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          PAYLOAD_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PAYLOAD_FILE"' EXIT
          awk -v version="$VERSION" '
            !found && $0 ~ ("^## \\[" version "\\]([[:space:]]|$)") { found=1 }
            found && /^## / && $0 !~ ("^## \\[" version "\\]([[:space:]]|$)") { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$NOTES_FILE"

          jq -n \
            --arg tag "$TAG" \
            --arg target "$TAG_SHA" \
            --arg name "Lagvex $TAG" \
            --rawfile body "$NOTES_FILE" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:false}' \
            > "$PAYLOAD_FILE"

          RELEASE="$(gh api --method POST "${API}/releases" --input "$PAYLOAD_FILE")"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == true' <<< "$RELEASE" >/dev/null
          echo "Created draft $TAG (release id $(jq -r '.id' <<< "$RELEASE"))."

  publish:
    needs: [detect, build-and-release, prepare-release-draft]
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@release-v1
    with:
      tag: ${{ needs.detect.outputs.tag }}
      artifact_pattern: release-assets-*
      artifact_directory: dist/release
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
