name: 🚀 Build & Publish Release 📦

on:
  create

permissions:
  actions: read
  contents: read

jobs:
  detect:
    name: 🔎 Detect Release Intent
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Resolve centrally created release tag
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHOULD_RELEASE="false"
          VERSION=""
          TAG=""
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?)$ ]]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Central release event: tag=$TAG should_release=$SHOULD_RELEASE"

  build-and-release:
    name: 📦 Build Multi-Platform & Publish
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: 🔨 Compile Release Binaries
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir -p dist

          # 1. Windows amd64 Client (Compiled as GUI subsystem to prevent terminal popup on double-click)
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui -X main.version=${VERSION}" -o dist/lagvex-client.exe ./cmd/lagvex-client
          
          # 2. Linux amd64 Client & Relay
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-client-linux-amd64 ./cmd/lagvex-client
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-relay ./cmd/lagvex-relay

          # 3. macOS arm64 (Apple Silicon) Client
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-client-darwin-arm64 ./cmd/lagvex-client

          # 4. macOS amd64 (Intel) Client
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/lagvex-client-darwin-amd64 ./cmd/lagvex-client

      - name: 📦 Package Archives
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          mkdir -p release-artifacts

          # 🪟 Windows Client ZIP
          mkdir -p pack-win
          cp dist/lagvex-client.exe pack-win/
          if [ -f "bin/amd64/wintun.dll" ]; then
            cp bin/amd64/wintun.dll pack-win/
          fi
          cp -r configs pack-win/
          cp README.md LICENSE pack-win/
          cd pack-win && zip -r ../release-artifacts/lagvex-${TAG}-windows-amd64.zip . && cd ..

          # 🐧 Linux Client TAR.GZ
          mkdir -p pack-linux
          cp dist/lagvex-client-linux-amd64 pack-linux/lagvex-client
          chmod +x pack-linux/lagvex-client
          cp scripts/start-linux.sh pack-linux/start.sh
          chmod +x pack-linux/start.sh
          cp scripts/lagvex.desktop pack-linux/
          cp -r configs pack-linux/
          cp README.md LICENSE pack-linux/
          tar -czvf release-artifacts/lagvex-${TAG}-linux-amd64.tar.gz -C pack-linux .

          # 🍎 macOS Client TAR.GZ (Apple Silicon)
          mkdir -p pack-darwin-arm64
          sh scripts/create-macos-app.sh dist/lagvex-client-darwin-arm64 pack-darwin-arm64 "${TAG#v}"
          cp dist/lagvex-client-darwin-arm64 pack-darwin-arm64/lagvex-client
          chmod +x pack-darwin-arm64/lagvex-client
          cp -r configs pack-darwin-arm64/
          cp README.md LICENSE pack-darwin-arm64/
          tar -czvf release-artifacts/lagvex-${TAG}-darwin-arm64.tar.gz -C pack-darwin-arm64 .

          # 🍎 macOS Client TAR.GZ (Intel)
          mkdir -p pack-darwin-amd64
          sh scripts/create-macos-app.sh dist/lagvex-client-darwin-amd64 pack-darwin-amd64 "${TAG#v}"
          cp dist/lagvex-client-darwin-amd64 pack-darwin-amd64/lagvex-client
          chmod +x pack-darwin-amd64/lagvex-client
          cp -r configs pack-darwin-amd64/
          cp README.md LICENSE pack-darwin-amd64/
          tar -czvf release-artifacts/lagvex-${TAG}-darwin-amd64.tar.gz -C pack-darwin-amd64 .

          # ☁️ Linux Relay Server TAR.GZ
          mkdir -p pack-relay
          cp dist/lagvex-relay pack-relay/
          cp scripts/install-relay.sh pack-relay/
          cp docker-compose.yml Dockerfile pack-relay/
          cp README.md LICENSE pack-relay/
          tar -czvf release-artifacts/lagvex-relay-${TAG}-linux-amd64.tar.gz -C pack-relay .

          # 🔐 Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum * > checksums.txt
          cd ..

      - name: Upload packaged assets for the shared publisher
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-lagvex
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    needs: [detect, build-and-release]
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@d552fc0ed83e771837ac3946d4d3346e0e4baf7c
    with:
      tag: ${{ needs.detect.outputs.tag }}
      artifact_pattern: release-assets-*
      artifact_directory: dist/release
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
