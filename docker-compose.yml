services:
  relay:
    build: .
    container_name: lagvex-relay
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - LAGVEX_PSK=${LAGVEX_PSK:-change_this_to_your_secure_psk}
      - LAGVEX_PORT=51820
      - LAGVEX_SUBNET=10.88.0.0/24
    volumes:
      - ./data:/etc/lagvex
